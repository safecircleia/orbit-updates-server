name: Pre-Deploy Updates Server

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and override deploy branch
        run: |
          git checkout main
          git pull

          git branch -D deploy || true
          git checkout -b deploy

      - name: Write redirects
        run: |
          python scripts/write_redirects.py

      - name: Add confirm message
        run: |
          echo "Ready to deploy!"

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 🔖 Updated update server
          commit_user_name: Orbit Browser Robot
          commit_user_email: orbit-browser-auto@users.noreply.github.com
          branch: deploy
          push_options: "--force"
